services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: erp
      MYSQL_USER: erp
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment: &backend_environment
      APP_NAME: ERP
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Define APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: erp
      DB_USERNAME: erp
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FRONTEND_URL: ${APP_URL:-http://localhost:8080}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-erp@example.test}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
  worker:
    build: ./backend
    environment: *backend_environment
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120"]
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on: [backend]
volumes:
  mysql_data:
  app_storage:
